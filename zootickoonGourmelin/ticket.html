<body>
	<h1>Signaler un incident</h1>
	<ul>
		<li><a href="index.html">Accueil</a></li>

		<li><a href="index.html#horaires">Horaires</a></li>
	</ul>
	<form action="traiter_ticket.php" method="post">
		<fieldset>
			<Legend>Déclaration d'incident</Legend>
			<label for ="secteur">Secteur concerné</label>
			<select id="secteur" name="secteur" required>
				<option value="">Choisissez un secteur</option>
				<option value="SAV">Savane</option>
				<option value="FOR">Forêt tropicale</option>
				<option value="BAN">Banquise</option>
				<option value="FER">Ferme pédagogique</option>
				<option value="VOL">Grande volière</option>
				<option value="AQUA">Aquarium</option>
			</select>
			<label for="sujet">Sujet</label>
			<input id="sujet" name="sujet" type="text" maxlength="120" required>
			<label for="description">Description</label>
			<textarea id="description" name="description" maxlength="255" required></textarea>
				<fieldset>
					<legend>Priorité</legend>
					<input type="checkbox" id="u1" name="priorite" value="basse">
						<label for="u1">Basse</label>
					<input type="checkbox" id="u2" name="priorite" value="moyenne">
						<label for="u2">Moyenne</label>
					<input type="checkbox" id="u3" name="priorite" value="haute">
						<label for="u3">Haute</label>
				</fieldset>
				<label for="mel">Votre adresse e-mail</label>
				<input id="mel" name="mel" type="email" required>
				<button> Envoyer</button>
		</fieldset>
		</form>
<p> Parc animalier de Val-Sorim -- route des Etangs, Val Sorim</p>
